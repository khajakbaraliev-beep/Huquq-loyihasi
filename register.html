<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ro'yxatdan o'tish — EKOLOGY</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="auth-container">
  <div class="auth-card">

    <a href="index.html" class="auth-logo">
      <div class="auth-logo-icon">🌱</div>
      <div class="auth-logo-text">EKOLOGY</div>
    </a>

    <h1 class="auth-title">Ro'yxatdan o'tish</h1>
    <p class="auth-subtitle">Bir daqiqada hisob yarating</p>

    <div class="auth-error" id="registerError"></div>

    <form class="auth-form" id="registerForm">

      <div class="form-group">
        <label>Ismingiz</label>
        <input type="text" id="regName" placeholder="Ism Familiya" autocomplete="name">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="email@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label>Parol</label>
        <div class="password-wrap">
          <input type="password" id="regPassword" placeholder="Kamida 6 ta belgi" autocomplete="new-password">
          <button type="button" class="password-toggle" id="regPasswordToggle">👁️</button>
        </div>
        <div class="password-strength">
          <div class="password-strength-bar"></div>
          <div class="password-strength-bar"></div>
          <div class="password-strength-bar"></div>
          <div class="password-strength-bar"></div>
        </div>
        <div class="password-hint">Katta harf, raqam va belgi qo'shsangiz — kuchliroq</div>
      </div>

      <div class="form-group">
        <label>Parolni tasdiqlang</label>
        <input type="password" id="regConfirm" placeholder="Parolni qayta kiriting" autocomplete="new-password">
      </div>

      <button type="submit" class="auth-btn" id="registerBtn">
        <div class="spinner"></div>
        <span class="btn-text">✨ Ro'yxatdan o'tish</span>
      </button>

    </form>

    <div class="auth-footer">
      Hisobingiz bormi?
      <a href="login.html">Kirish</a>
    </div>

  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
