<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>3D O'rmon — Muammoni Hal Qil</title>
<style>
  body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
  canvas { display: block; }

  #title {
    position: absolute; top: 20px; left: 50%;
    transform: translateX(-50%);
    color: #fff; font-size: 20px; font-weight: bold;
    text-shadow: 0 0 10px #000;
    pointer-events: none; z-index: 10;
    letter-spacing: 2px;
  }

  #hud {
    position: absolute; top: 20px; left: 20px;
    background: rgba(0,0,0,0.75); color: #fff;
    padding: 14px 20px; border-radius: 10px;
    font-size: 14px; z-index: 10;
    border-left: 4px solid #7CFC00;
  }
  #hud .score { color: #FFD700; font-weight: bold; font-size: 20px; }
  #hud .solved { color: #7CFC00; font-weight: bold; }
  #hud .wrong { color: #ff4444; font-weight: bold; }

  /* Muammo sarlavhasi */
  #problemBox {
    position: absolute; top: 80px; left: 50%;
    transform: translateX(-50%);
    background: rgba(20,20,20,0.9);
    color: #fff; padding: 16px 30px;
    border-radius: 12px;
    border: 2px solid #ff4444;
    box-shadow: 0 0 30px rgba(255,68,68,0.6);
    text-align: center; z-index: 10;
    min-width: 400px;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #problemBox.show { opacity: 1; }
  #problemBox .icon { font-size: 36px; }
  #problemBox h2 { margin: 5px 0; color: #ff6666; font-size: 20px; }
  #problemBox p { margin: 5px 0 0; font-size: 13px; color: #ccc; }

  /* Yechim tugmalari */
  #solutions {
    position: absolute; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 15px;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #solutions.show { opacity: 1; }

  .solution-btn {
    background: rgba(20,20,20,0.95);
    color: #fff;
    border: 2px solid #4CAF50;
    padding: 18px 24px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.25s;
    max-width: 220px;
    text-align: center;
    font-family: inherit;
    line-height: 1.4;
  }
  .solution-btn:hover {
    background: #4CAF50;
    color: #fff;
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(76,175,80,0.5);
  }
  .solution-btn .emoji { font-size: 28px; display: block; margin-bottom: 8px; }
  .solution-btn.correct {
    background: #4CAF50;
    border-color: #4CAF50;
    animation: pulse 0.5s;
  }
  .solution-btn.wrong {
    background: #ff4444;
    border-color: #ff4444;
    animation: shake 0.5s;
  }
  .solution-btn:disabled { cursor: not-allowed; opacity: 0.6; }

  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* Natija xabari */
  #resultMsg {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    color: #fff; font-size: 60px;
    font-weight: bold; z-index: 20;
    pointer-events: none;
    text-shadow: 0 0 30px currentColor;
    transition: transform 0.3s;
  }
  #resultMsg.show {
    transform: translate(-50%, -50%) scale(1);
  }

  /* O'yin tugashi */
  #gameOver {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    display: none; justify-content: center;
    align-items: center; flex-direction: column;
    color: #fff; z-index: 100;
  }
  #gameOver.show { display: flex; }
  #gameOver h1 { font-size: 60px; color: #FFD700; margin-bottom: 20px; }
  #gameOver p { font-size: 24px; margin-bottom: 10px; }
  #gameOver .big { font-size: 80px; color: #7CFC00; font-weight: bold; }
  #gameOver button {
    margin-top: 30px;
    background: #4CAF50; color: #fff;
    border: none; padding: 16px 40px;
    border-radius: 10px; font-size: 18px;
    cursor: pointer; font-family: inherit;
    transition: 0.3s;
  }
  #gameOver button:hover { background: #45a049; transform: scale(1.05); }

  #vignette {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center,
      transparent 40%, rgba(0,0,0,0.6) 100%);
  }/* Orqaga qaytish tugmasi */
#backBtn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: linear-gradient(135deg, #4CAF50, #2d6a1f);
  color: #fff;
  padding: 12px 24px;
  border-radius: 25px;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 1px;
  z-index: 20;
  box-shadow: 0 5px 15px rgba(76,175,80,0.4);
  transition: all 0.3s;
  border: 1px solid rgba(124,252,0,0.5);
  display: flex;
  align-items: center;
  gap: 8px;
}
#backBtn:hover {
  background: linear-gradient(135deg, #7CFC00, #4CAF50);
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(124,252,0,0.6);
}
#backBtn:active {
  transform: translateY(0);
}
a{
  text-decoration: none;
  color: whitesmoke;
}
</style>
</head>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   1. SAHNA
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2a1a);
scene.fog = new THREE.FogExp2(0x1a2a1a, 0.012);

const camera = new THREE.PerspectiveCamera(
  70, window.innerWidth / window.innerHeight, 0.1, 500
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ============================================================
   2. YORUG'LIK
   ============================================================ */
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const sun = new THREE.DirectionalLight(0xffffee, 1.0);
sun.position.set(40, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;
scene.add(sun);

scene.add(new THREE.HemisphereLight(0x88ff88, 0x223322, 0.5));

/* ============================================================
   3. YER
   ============================================================ */
const groundGeo = new THREE.PlaneGeometry(400, 400, 80, 80);
const gpos = groundGeo.attributes.position;
for (let i = 0; i < gpos.count; i++) {
  const x = gpos.getX(i);
  const y = gpos.getY(i);
  gpos.setZ(i, Math.sin(x * 0.1) * Math.cos(y * 0.1) * 1.5);
}
groundGeo.computeVertexNormals();

const ground = new THREE.Mesh(
  groundGeo,
  new THREE.MeshStandardMaterial({ color: 0x2d5a1e, flatShading: true })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   4. DARAXTLAR
   ============================================================ */
function createTree(x, z, scale = 1) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25 * scale, 0.45 * scale, 4 * scale, 6),
    new THREE.MeshStandardMaterial({ color: 0x5a3a1a })
  );
  trunk.position.y = 2 * scale;
  trunk.castShadow = true;
  tree.add(trunk);

  const leafColors = [0x2d6a1f, 0x3a7d2c, 0x1f5a15, 0x4a8d3a];
  const leafMat = new THREE.MeshStandardMaterial({
    color: leafColors[Math.floor(Math.random() * leafColors.length)],
    flatShading: true
  });
  for (let i = 0; i < 3; i++) {
    const leaf = new THREE.Mesh(
      new THREE.ConeGeometry((2.2 - i * 0.5) * scale, (2.5 - i * 0.3) * scale, 7),
      leafMat
    );
    leaf.position.y = (3.5 + i * 1.2) * scale;
    leaf.castShadow = true;
    tree.add(leaf);
  }
  tree.position.set(x, 0, z);
  tree.rotation.y = Math.random() * Math.PI * 2;
  return tree;
}

for (let i = 0; i < 250; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 8 + Math.random() * 140;
  scene.add(createTree(Math.cos(a) * r, Math.sin(a) * r, 0.7 + Math.random() * 0.9));
}

/* Butalar, toshlar, gullar */
for (let i = 0; i < 80; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 5 + Math.random() * 120;
  const bush = new THREE.Group();
  for (let j = 0; j < 4; j++) {
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(0.4 + Math.random() * 0.3, 6, 6),
      new THREE.MeshStandardMaterial({ color: 0x3a6a20, flatShading: true })
    );
    s.position.set((Math.random() - 0.5) * 0.8, 0.3 + Math.random() * 0.3, (Math.random() - 0.5) * 0.8);
    s.castShadow = true;
    bush.add(s);
  }
  bush.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  scene.add(bush);
}

for (let i = 0; i < 40; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 10 + Math.random() * 130;
  const size = 0.5 + Math.random() * 1.5;
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(size, 0),
    new THREE.MeshStandardMaterial({ color: 0x666666, flatShading: true })
  );
  rock.position.set(Math.cos(a) * r, size * 0.5, Math.sin(a) * r);
  rock.rotation.set(Math.random(), Math.random(), Math.random());
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
}

/* ============================================================
   5. O'YIN MA'LUMOTLARI — har bir muammo uchun yechimlar
   ============================================================ */
const problemsData = [
  {
    icon: '🪓',
    title: "O'rmon Kesilishi",
    text: "Daraxtlar noqonuniy kesilmoqda. Nima qilasiz?",
    correctIndex: 1,
    solutions: [
      { emoji: '💰', text: "Ko'proq daraxt kesib pul ishlash" },
      { emoji: '🌱', text: "Yangi daraxtlar ekish va qonunni buzganlarni jazolash" },
      { emoji: '🤷', text: "Hech narsa qilmaslik" }
    ],
    create: (x, z) => {
      const g = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0x4a2f18 });
      for (let i = 0; i < 3; i++) {
        const stump = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 0.6, 8), mat);
        stump.position.set((i - 1) * 1.5, 0.3, 0);
        stump.castShadow = true;
        g.add(stump);
      }
      const fallen = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 4, 8), mat);
      fallen.rotation.z = Math.PI / 2;
      fallen.position.set(2, 0.4, 1);
      fallen.castShadow = true;
      g.add(fallen);
      g.position.set(x, 0, z);
      return g;
    }
  },
  {
    icon: '🗑️',
    title: "Plastik Chiqindi",
    text: "O'rmonda plastik chiqindilar to'plangan. Nima qilasiz?",
    correctIndex: 2,
    solutions: [
      { emoji: '🔥', text: "Hammasini yoqib yuborish" },
      { emoji: '🚮', text: "Shunchaki qoldirish" },
      { emoji: '♻️', text: "Yig'ib qayta ishlashga topshirish" }
    ],
    create: (x, z) => {
      const g = new THREE.Group();
      const colors = [0xff3333, 0xffff33, 0x3333ff, 0x33ff33, 0xff8800];
      for (let i = 0; i < 12; i++) {
        const box = new THREE.Mesh(
          new THREE.BoxGeometry(0.3 + Math.random() * 0.4, 0.2 + Math.random() * 0.3, 0.3 + Math.random() * 0.4),
          new THREE.MeshStandardMaterial({ color: colors[i % colors.length] })
        );
        box.position.set((Math.random() - 0.5) * 3, 0.2 + Math.random() * 0.3, (Math.random() - 0.5) * 3);
        box.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
        box.castShadow = true;
        g.add(box);
      }
      g.position.set(x, 0, z);
      return g;
    }
  },
  {
    icon: '🔥',
    title: "O'rmon Yong'ini",
    text: "O'rmonda yong'in boshlandi. Nima qilasiz?",
    correctIndex: 0,
    solutions: [
      { emoji: '🚒', text: "O't o'chiruvchilarni chaqirish va xavfsiz joyga ketish" },
      { emoji: '📱', text: "Video olib, internetga qo'yish" },
      { emoji: '🏃', text: "Yong'in ichiga kirib o'chirish" }
    ],
    create: (x, z) => {
      const g = new THREE.Group();
      const burntMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
      for (let i = 0; i < 4; i++) {
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.3, 3, 6), burntMat);
        trunk.position.set((i - 2) * 1.2, 1.5, Math.random() * 1.5 - 0.75);
        trunk.rotation.z = (Math.random() - 0.5) * 0.4;
        trunk.castShadow = true;
        g.add(trunk);
      }
      for (let i = 0; i < 15; i++) {
        const fire = new THREE.Mesh(
          new THREE.ConeGeometry(0.2, 0.6, 6),
          new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff4400 : 0xffaa00 })
        );
        fire.position.set((Math.random() - 0.5) * 3, 0.3 + Math.random() * 0.5, (Math.random() - 0.5) * 3);
        fire.userData.isFire = true;
        g.add(fire);
      }
      g.position.set(x, 0, z);
      return g;
    }
  },
  {
    icon: '💧',
    title: "Suv Ifloslanishi",
    text: "Daryo suvi ifloslangan. Nima qilasiz?",
    correctIndex: 1,
    solutions: [
      { emoji: '🚰', text: "Iflos suvni ichish" },
      { emoji: '🏭', text: "Zavodlarga tozalash inshooti qurish" },
      { emoji: '🐟', text: "Baliqlarni boshqa joyga ko'chirish" }
    ],
    create: (x, z) => {
      const g = new THREE.Group();
      const water = new THREE.Mesh(
        new THREE.CircleGeometry(3, 32),
        new THREE.MeshStandardMaterial({ color: 0x3a2a10, transparent: true, opacity: 0.85 })
      );
      water.rotation.x = -Math.PI / 2;
      water.position.y = 0.05;
      g.add(water);
      for (let i = 0; i < 10; i++) {
        const spot = new THREE.Mesh(
          new THREE.CircleGeometry(0.2 + Math.random() * 0.4, 12),
          new THREE.MeshBasicMaterial({ color: 0x1a0a00 })
        );
        spot.rotation.x = -Math.PI / 2;
        spot.position.set((Math.random() - 0.5) * 4, 0.06, (Math.random() - 0.5) * 4);
        g.add(spot);
      }
      g.position.set(x, 0, z);
      return g;
    }
  },
  {
    icon: '🏭',
    title: "Havo Ifloslanishi",
    text: "Zavod havoni ifloslantirmoqda. Nima qilasiz?",
    correctIndex: 0,
    solutions: [
      { emoji: '🌬️', text: "Filtr o'rnatish va toza energiyaga o'tish" },
      { emoji: '🏭', text: "Yana zavod qurish" },
      { emoji: '😷', text: "Niqob taqib yurish" }
    ],
    create: (x, z) => {
      const g = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0x555555 });
      const factory = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), mat);
      factory.position.y = 1.5;
      factory.castShadow = true;
      g.add(factory);
      for (let i = 0; i < 2; i++) {
        const chimney = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 3, 8), mat);
        chimney.position.set((i - 0.5) * 1.5, 4.5, 0);
        chimney.castShadow = true;
        g.add(chimney);
      }
      for (let i = 0; i < 8; i++) {
        const smoke = new THREE.Mesh(
          new THREE.SphereGeometry(0.5 + Math.random() * 0.5, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.5 })
        );
        smoke.position.set((Math.random() - 0.5) * 2, 5 + i * 0.8, (Math.random() - 0.5) * 2);
        smoke.userData.isSmoke = true;
        g.add(smoke);
      }
      g.position.set(x, 0, z);
      return g;
    }
  },
  {
    icon: '🏜️',
    title: "Tuproq Degradatsiyasi",
    text: "Yer cho'llanib bormoqda. Nima qilasiz?",
    correctIndex: 1,
    solutions: [
      { emoji: '💧', text: "Ko'proq suv sepish" },
      { emoji: '🌳', text: "Daraxt ekish va suvni tejash" },
      { emoji: '🏗️', text: "Uy qurish" }
    ],
    create: (x, z) => {
      const g = new THREE.Group();
      const patch = new THREE.Mesh(
        new THREE.CircleGeometry(3, 32),
        new THREE.MeshStandardMaterial({ color: 0xc2a878 })
      );
      patch.rotation.x = -Math.PI / 2;
      patch.position.y = 0.02;
      g.add(patch);
      for (let i = 0; i < 5; i++) {
        const bush = new THREE.Mesh(
          new THREE.SphereGeometry(0.4, 6, 6),
          new THREE.MeshStandardMaterial({ color: 0x8a7040 })
        );
        bush.position.set((Math.random() - 0.5) * 4, 0.3, (Math.random() - 0.5) * 4);
        g.add(bush);
      }
      g.position.set(x, 0, z);
      return g;
    }
  },
  {
    icon: '🐾',
    title: "Brakonerlik",
    text: "Noyob hayvonlar noqonuniy ovlanmoqda. Nima qilasiz?",
    correctIndex: 2,
    solutions: [
      { emoji: '💰', text: "Brakonerlarga pul to'lash" },
      { emoji: '🤐', text: "Ko'rgan narsani aytmaslik" },
      { emoji: '📞', text: "Qo'riqxonaga xabar berish" }
    ],
    create: (x, z) => {
      const g = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0x444444 });
      for (let i = 0; i < 8; i++) {
        const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2, 6), mat);
        const a = (i / 8) * Math.PI * 2;
        bar.position.set(Math.cos(a) * 1, 1, Math.sin(a) * 1);
        g.add(bar);
      }
      for (let y = 0; y <= 2; y += 2) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.06, 6, 20), mat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = y;
        g.add(ring);
      }
      const animal = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0xdd8844 })
      );
      animal.position.y = 0.5;
      g.add(animal);
      g.position.set(x, 0, z);
      return g;
    }
  },
  {
    icon: '☢️',
    title: "Zaharli Chiqindi",
    text: "Zaharli chiqindi ko'milgan. Nima qilasiz?",
    correctIndex: 0,
    solutions: [
      { emoji: '🚨', text: "Mutaxassislarni chaqirib, xavfsiz tozalash" },
      { emoji: '👷', text: "O'zim qo'l bilan olib tashlash" },
      { emoji: '🤷', text: "Hech narsa qilmaslik" }
    ],
    create: (x, z) => {
      const g = new THREE.Group();
      for (let i = 0; i < 4; i++) {
        const barrel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.5, 0.5, 1.2, 12),
          new THREE.MeshStandardMaterial({ color: 0x88aa00 })
        );
        barrel.position.set((Math.random() - 0.5) * 2, 0.6, (Math.random() - 0.5) * 2);
        barrel.rotation.y = Math.random() * Math.PI;
        barrel.castShadow = true;
        g.add(barrel);
      }
      g.position.set(x, 0, z);
      return g;
    }
  }
];

/* ============================================================
   6. O'YIN HOLATI
   ============================================================ */
let score = 0;
let solvedCount = 0;
let wrongCount = 0;
let currentProblemIndex = -1;
let currentProblemModel = null;
let isAnswering = false;
const TOTAL_PROBLEMS = problemsData.length;

const scoreEl = document.getElementById('score');
const solvedEl = document.getElementById('solved');
const wrongEl = document.getElementById('wrong');
const problemBox = document.getElementById('problemBox');
const problemIcon = document.getElementById('problemIcon');
const problemTitle = document.getElementById('problemTitle');
const problemText = document.getElementById('problemText');
const solutionsEl = document.getElementById('solutions');
const resultMsg = document.getElementById('resultMsg');
const gameOverEl = document.getElementById('gameOver');

/* ============================================================
   7. KAMERA
   ============================================================ */
const cameraPath = {
  angle: 0,
  radius: 55,
  speed: 0.06,
  height: 3,
  bobPhase: 0
};

/* ============================================================
   8. YANGI MUAMMONI CHIQARISH
   ============================================================ */
function nextProblem() {
  currentProblemIndex++;

  // Hammasi tugadimi?
  if (currentProblemIndex >= TOTAL_PROBLEMS) {
    endGame();
    return;
  }

  const data = problemsData[currentProblemIndex];

  // 3D modelni yaratish
  const angle = (currentProblemIndex / TOTAL_PROBLEMS) * Math.PI * 2;
  const x = Math.cos(angle) * 15;
  const z = Math.sin(angle) * 15;

  // Kamerani muammoga qaratish uchun pozitsiya
  const camX = Math.cos(angle) * cameraPath.radius;
  const camZ = Math.sin(angle) * cameraPath.radius;

  // Modelni kameraning oldiga qo'yish (kameradan 12 metr narida)
  const dirX = -Math.cos(angle);
  const dirZ = -Math.sin(angle);
  const targetX = camX + dirX * 12;
  const targetZ = camZ + dirZ * 12;

  currentProblemModel = data.create(targetX, targetZ);
  currentProblemModel.userData = {
    icon: data.icon,
    targetScale: 1,
    isActive: true
  };
  currentProblemModel.scale.set(0.01, 0.01, 0.01);
  scene.add(currentProblemModel);

  // UI
  problemIcon.textContent = data.icon;
  problemTitle.textContent = data.title;
  problemText.textContent = data.text;
  problemBox.classList.add('show');

  // Yechim tugmalarini yaratish
  solutionsEl.innerHTML = '';
  data.solutions.forEach((sol, i) => {
    const btn = document.createElement('button');
    btn.className = 'solution-btn';
    btn.innerHTML = `<span class="emoji">${sol.emoji}</span>${sol.text}`;
    btn.dataset.index = i;
    btn.addEventListener('click', () => checkAnswer(i, data.correctIndex, btn));
    solutionsEl.appendChild(btn);
  });

  setTimeout(() => solutionsEl.classList.add('show'), 200);

  isAnswering = true;
}

/* ============================================================
   9. JAVOBNI TEKSHIRISH
   ============================================================ */
function checkAnswer(selectedIndex, correctIndex, btn) {
  if (!isAnswering) return;
  isAnswering = false;

  // Barcha tugmalarni bloklash
  document.querySelectorAll('.solution-btn').forEach(b => b.disabled = true);

  if (selectedIndex === correctIndex) {
    // ✅ TO'G'RI
    btn.classList.add('correct');
    score += 100;
    solvedCount++;
    scoreEl.textContent = score;
    solvedEl.textContent = solvedCount;

    // 3D modelni "yashil" qilish va yo'qolish
    if (currentProblemModel) {
      currentProblemModel.traverse(obj => {
        if (obj.material && obj.material.color) {
          obj.material = obj.material.clone();
          obj.material.color.setHex(0x00ff00);
        }
      });
      currentProblemModel.userData.targetScale = 0.01;
    }

    showResult('✅', '#4CAF50');

    setTimeout(() => {
      cleanupAndNext();
    }, 1800);

  } else {
    // ❌ NOTO'G'RI
    btn.classList.add('wrong');
    score = Math.max(0, score - 30);
    wrongCount++;
    scoreEl.textContent = score;
    wrongEl.textContent = wrongCount;

    showResult('❌', '#ff4444');

    // To'g'ri javobni ko'rsatish
    setTimeout(() => {
      const buttons = document.querySelectorAll('.solution-btn');
      if (buttons[correctIndex]) {
        buttons[correctIndex].classList.add('correct');
      }

      setTimeout(() => {
        if (currentProblemModel) {
          currentProblemModel.userData.targetScale = 0.01;
        }
        setTimeout(cleanupAndNext, 800);
      }, 1500);
    }, 800);
  }
}

function showResult(symbol, color) {
  resultMsg.textContent = symbol;
  resultMsg.style.color = color;
  resultMsg.classList.add('show');
  setTimeout(() => resultMsg.classList.remove('show'), 1500);
}

function cleanupAndNext() {
  if (currentProblemModel) {
    scene.remove(currentProblemModel);
    currentProblemModel = null;
  }
  problemBox.classList.remove('show');
  solutionsEl.classList.remove('show');

  setTimeout(() => {
    nextProblem();
  }, 500);
}

/* ============================================================
   10. O'YIN TUGASHI
   ============================================================ */
function endGame() {
  document.getElementById('finalScore').textContent = score;

  let msg = '';
  if (solvedCount === TOTAL_PROBLEMS && wrongCount === 0) {
    msg = '🏆 Mukammal! Siz haqiqiy ekolog ekansiz!';
  } else if (solvedCount >= TOTAL_PROBLEMS * 0.7) {
    msg = '👏 Yaxshi natija! Tabiatni sevasiz!';
  } else if (solvedCount >= TOTAL_PROBLEMS * 0.4) {
    msg = '👍 Yomon emas, lekin o\'rganish kerak.';
  } else {
    msg = '📚 Ekologiya haqida ko\'proq o\'qishingiz kerak.';
  }
  document.getElementById('finalMessage').textContent = msg;

  gameOverEl.classList.add('show');
}

/* ============================================================
   11. ANIMATSIYA LOOP
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.1);
  const time = clock.getElapsedTime();

  // Kamera aylana bo'ylab
  cameraPath.angle += cameraPath.speed * delta;
  cameraPath.bobPhase += delta * 4;

  const bob = Math.sin(cameraPath.bobPhase) * 0.08;
  camera.position.x = Math.cos(cameraPath.angle) * cameraPath.radius;
  camera.position.z = Math.sin(cameraPath.angle) * cameraPath.radius;
  camera.position.y = cameraPath.height + bob;

  const nextAngle = cameraPath.angle + 0.1;
  camera.lookAt(
    Math.cos(nextAngle) * cameraPath.radius,
    cameraPath.height,
    Math.sin(nextAngle) * cameraPath.radius
  );

  // Muammo modeli animatsiyasi
  if (currentProblemModel && currentProblemModel.userData.targetScale !== undefined) {
    const cur = currentProblemModel.scale.x;
    const tgt = currentProblemModel.userData.targetScale;
    const ns = cur + (tgt - cur) * delta * 8;
    currentProblemModel.scale.set(ns, ns, ns);

    if (tgt > 0.5) {
      currentProblemModel.rotation.y += delta * 0.6;
      currentProblemModel.position.y = Math.sin(time * 2) * 0.1;
    }
  }

  // Olov va tutun
  scene.traverse(obj => {
    if (obj.userData.isFire) {
      obj.scale.y = 1 + Math.sin(time * 10 + obj.position.x) * 0.3;
      obj.material.color.setHSL(0.05, 1, 0.4 + Math.random() * 0.3);
    }
    if (obj.userData.isSmoke) {
      obj.position.y += delta * 0.5;
      obj.material.opacity -= delta * 0.1;
      if (obj.position.y > 12) {
        obj.position.y = 5;
        obj.material.opacity = 0.5;
      }
    }
  });

  renderer.render(scene, camera);
}

animate();

/* ============================================================
   12. O'YINNI BOSHLASH
   ============================================================ */
setTimeout(() => {
  nextProblem();
}, 1500);

/* ============================================================
   13. OYNA O'LCHAMI
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
