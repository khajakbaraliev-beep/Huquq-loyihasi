<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirish — EKOLOGY</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="auth-container">
  <div class="auth-card">

    <a href="index.html" class="auth-logo">
      <div class="auth-logo-icon">🌱</div>
      <div class="auth-logo-text">EKOLOGY</div>
    </a>

    <h1 class="auth-title">Xush kelibsiz!</h1>
    <p class="auth-subtitle">Hisobingizga kiring va davom eting</p>

    <div class="auth-error" id="loginError"></div>

    <form class="auth-form" id="loginForm">

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="email@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label>Parol</label>
        <div class="password-wrap">
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="password-toggle" id="loginPasswordToggle">👁️</button>
        </div>
      </div>

      <div class="remember-row">
        <label class="checkbox-wrap">
          <input type="checkbox" id="rememberMe">
          Eslab qol
        </label>
        <a href="#" class="forgot-link" onclick="alert('Parolni tiklash demo rejimida ishlamaydi');return false;">
          Parolni unutdingizmi?
        </a>
      </div>

      <button type="submit" class="auth-btn" id="loginBtn">
        <div class="spinner"></div>
        <span class="btn-text">🔐 Kirish</span>
      </button>

    </form>

    <div class="auth-footer">
      Hisobingiz yo'qmi?
      <a href="register.html">Ro'yxatdan o'tish</a>
    </div>

  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
